name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Pruebas del backend (10 suites + lint)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: motor_segmentacion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/motor_segmentacion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Preparar base de datos y datos
        run: |
          python -m src.persistence.init_db
          python -m crm_simulator.generate_data

      - name: Levantar simulador CRM e ingerir
        run: |
          nohup python -m uvicorn crm_simulator.app:app --port 8001 &
          sleep 6
          python -m src.persistence.ingest

      - name: Segmentacion inicial
        run: python -m src.ml.segmentation

      - name: Pruebas (10 suites)
        run: |
          for t in contrato adapter features clustering segmentation recommendations scoring api audiences sources; do
            echo "== tests.test_$t =="
            python -m tests.test_$t
          done

      - name: Lint (ruff)
        run: python -m ruff check src tests crm_simulator azure

  frontend:
    name: Build del frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Compilar (tsc + vite)
        run: npm run build
        working-directory: frontend

  docker:
    name: Stack completo con docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Levantar stack
        run: docker compose up -d --build

      - name: Esperar backend y frontend
        run: |
          echo "Esperando /health del backend (el arranque incluye ingesta y segmentacion)..."
          ok=0
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8000/health; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "El backend no respondio a tiempo"; exit 1; fi
          curl -fs http://localhost:8000/health
          curl -fs http://localhost:5173 > /dev/null
          echo "Backend (8000) y frontend (5173) responden"

      - name: Comprobar datos y segmentos del stack
        run: |
          curl -fs "http://localhost:8000/customers?limit=1" | grep -q '"total":498'
          curl -fs http://localhost:8000/segments | grep -q '"count":6'
          echo "Datos y segmentos vigentes dentro del stack docker"

      - name: Registros si algo falla
        if: failure()
        run: docker compose logs
