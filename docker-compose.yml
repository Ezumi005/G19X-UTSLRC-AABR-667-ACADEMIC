services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: motor_segmentacion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  simulador:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: python -m uvicorn crm_simulator.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: >
      sh -c "python -m src.persistence.init_db &&
             python -m src.persistence.ingest &&
             python -m src.ml.segmentation &&
             python -m uvicorn src.api.app:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/motor_segmentacion
      SIMULATOR_URL: http://simulador:8001
      AZURE_SCORING_URL: ${AZURE_SCORING_URL:-}
      AZURE_SCORING_KEY: ${AZURE_SCORING_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5-4-mini-dz}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      simulador:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
